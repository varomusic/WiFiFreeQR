<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><title>¡JA JA JA! 🦍</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:white;font-family:system-ui,Arial,sans-serif}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}img{width:100%;height:100dvh;object-fit:contain;display:block}button{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.76);color:white;border:2px solid #fff;border-radius:30px;padding:13px 22px;font-size:17px;font-weight:700;white-space:nowrap;cursor:pointer}button:active{transform:translateX(-50%) scale(.97)}
</style></head>
<body><main><img src="gorila.png" alt="Gorila riéndose y haciendo una broma"><button id="laugh" type="button">🔊 ¡Escucha la risa!</button></main>
<script>
(()=>{
let context,playing=false;
const button=document.getElementById('laugh');
function laugh(){
  if(playing)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){button.textContent='🔇 Audio no disponible';return;}
  try{
    context=context||new AC();context.resume();playing=true;
    button.textContent='🦍 ¡JA JA JA!';
    const start=context.currentTime+.03;
    // Carcajada gutural sintética: pulsos con tono grave, rugosidad y aire.
    const syllables=[0,.24,.48,.77,1.02,1.31,1.56,1.89,2.16,2.47,2.73,3.02];
    syllables.forEach((offset,i)=>{
      const t=start+offset,d=.17+(i%3)*.028;
      const gain=context.createGain();gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(.19+(i%3)*.035,t+.028);
      gain.gain.exponentialRampToValueAtTime(.0001,t+d);
      gain.connect(context.destination);
      [0,1,2].forEach((h)=>{
        const osc=context.createOscillator();osc.type=h===0?'sawtooth':'triangle';
        const base=(83+(i%4)*9)*(h+1);
        osc.frequency.setValueAtTime(base,t);
        osc.frequency.exponentialRampToValueAtTime(base*.69,t+d);
        const hg=context.createGain();hg.gain.value=[.45,.21,.08][h];
        osc.connect(hg).connect(gain);osc.start(t);osc.stop(t+d+.015);
      });
    });
    window.setTimeout(()=>{playing=false;button.textContent='🔊 Repetir carcajada';},3700);
  }catch(e){playing=false;button.textContent='🔊 Toca para escuchar';}
}
button.addEventListener('click',laugh);
// Algunos navegadores permiten sonido al abrir; otros requieren interacción.
window.addEventListener('load',()=>{laugh();},{once:true});
})();
</script></body></html>
